<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f9e41" id="cor-do-navegador">
<title>IFhoot!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%232F9E41'/%3E%3Ccircle cx='14' cy='14' r='9' fill='%23C8191E' stroke='white' stroke-width='3'/%3E%3Ctext x='35' y='50' font-family='Arial' font-weight='900' font-size='42' text-anchor='middle' fill='white'%3E%3F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/estilo.css">
<!-- Biblioteca do Socket.IO no navegador: o próprio servidor entrega este arquivo (sem internet). -->
<script src="/socket.io/socket.io.js"></script>
<style>
  body.jogador { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  .barra-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); }
  .barra-topo .marca { font-size: 21px; }
  .barra-topo .logo { width: 32px; height: 32px; border-radius: 10px; font-size: 20px; }
  .barra-topo .logo::before { width: 13px; height: 13px; }
  .meus-pontos { padding: 6px 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.18); color: #fff; font-weight: 800; font-variant-numeric: tabular-nums; }
  main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding: 10px 16px 20px; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
  .centro { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; animation: entrar 0.35s ease both; }
  .grande { margin: 0; font-size: clamp(28px, 8vw, 40px); font-weight: 900; line-height: 1.1; }
  .sub { margin: 0; max-width: 34ch; color: var(--texto-2); font-size: 17px; line-height: 1.4; }
  .sub strong { color: var(--texto); }
  form { width: 100%; display: grid; gap: 12px; }
  .campo { width: 100%; padding: 16px 18px; border-radius: 16px; border: 2px solid var(--borda); background: var(--cartao); color: var(--texto); font: inherit; font-size: 20px; outline: none; }
  .campo:focus { border-color: var(--verde); }
  .botao.largo { width: 100%; padding: 16px; font-size: 20px; }
  .tempo { flex: none; height: 8px; border-radius: 999px; overflow: hidden; background: var(--trilho); }
  .tempo div { height: 100%; transform-origin: left; background: linear-gradient(90deg, var(--verde-escuro), var(--verde)); }
  .enunciado { margin: 0; font-size: clamp(19px, 5.4vw, 26px); font-weight: 800; line-height: 1.25; }
  .botoes-opcoes { flex: 1; min-height: 280px; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 12px; }
  .botoes-opcoes.duas { grid-template-columns: 1fr; }
  .btn-opcao { display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 14px; border-radius: 20px; background: var(--cor); color: var(--cor-texto); text-align: left; font-size: 19px; font-weight: 800; line-height: 1.2; box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.18); transition: transform 0.08s, opacity 0.2s; animation: entrar 0.35s ease both; }
  .btn-opcao:nth-child(2) { animation-delay: 0.05s; }
  .btn-opcao:nth-child(3) { animation-delay: 0.1s; }
  .btn-opcao:nth-child(4) { animation-delay: 0.15s; }
  .btn-opcao .letra { width: 42px; height: 42px; font-size: 20px; }
  .btn-opcao:active { transform: scale(0.97); }
  .botoes-opcoes.enviando { pointer-events: none; }
  .botoes-opcoes.enviando .btn-opcao:not(.escolhida) { opacity: 0.3; }
  .btn-opcao.escolhida { box-shadow: 0 0 0 4px var(--texto); }
  .selo { display: grid; place-items: center; width: 116px; height: 116px; border-radius: 50%; font-size: 56px; animation: pop 0.45s ease both; }
  .selo.ok { background: var(--ok); color: #fff; }
  .selo.erro { background: var(--erro); color: #fff; }
  .selo.neutro { background: var(--cartao); border: 2px solid var(--borda); }
  .pontos-ganhos { margin: 0; color: var(--ok); font-size: 40px; font-weight: 900; }
  .info { margin: 0; padding: 12px 18px; border-radius: 16px; background: var(--cartao); border: 1px solid var(--borda); color: var(--texto-2); }
  .info strong { color: var(--texto); }
  .lista-podio { list-style: none; width: 100%; margin: 6px 0 0; padding: 0; display: grid; gap: 8px; }
  .lista-podio li { display: grid; grid-template-columns: 3ch minmax(0, 1fr) auto; gap: 10px; padding: 12px 16px; border-radius: 14px; background: var(--cartao); border: 1px solid var(--borda); font-weight: 700; text-align: left; }
  .lista-podio li.eu { background: var(--verde-claro); border-color: var(--verde); box-shadow: inset 0 0 0 1px var(--verde); }

  /* Resultado: a tela inteira vira verde (acertou), vermelha (errou) ou cinza-azulada (sem resposta). */
  body[data-feedback] { --fb: #34495e; --texto: #fff; --texto-2: rgba(255, 255, 255, 0.88); background: var(--fb); color: #fff; transition: background 0.3s; }
  body[data-feedback="certo"] { --fb: var(--verde-escuro); }
  body[data-feedback="errado"] { --fb: var(--vermelho); }
  body[data-feedback] .barra-topo { background: transparent; box-shadow: none; }
  body[data-feedback] .selo { background: #fff; border: 0; color: var(--fb); }
  body[data-feedback] .pontos-ganhos { color: #fff; font-size: 48px; }
  body[data-feedback] .info { background: rgba(255, 255, 255, 0.16); border-color: transparent; }
  .reconectando { position: fixed; inset: 0 0 auto; z-index: 10; padding: 6px; background: var(--erro); color: #fff; font-size: 14px; font-weight: 700; text-align: center; transform: translateY(-100%); transition: transform 0.2s; }
  .reconectando.visivel { transform: none; }
</style>
</head>
<body class="jogador">
<div class="reconectando" id="reconectando">Sem conexão. Tentando de novo…</div>
<header class="barra-topo barra-marca">
  <div class="marca"><span class="logo" aria-hidden="true">?</span> IFhoot!</div>
  <span class="meus-pontos" id="meus-pontos" hidden></span>
</header>
<main id="tela">
  <div class="centro"><p class="sub">Conectando…</p></div>
</main>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
// Escapa o texto antes de colocar no HTML: um apelido como "<script>" vira texto, não código.
const esc = (texto) => String(texto ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n).toLocaleString('pt-BR');
const LETRAS = ['A', 'B', 'C', 'D'];

// O id do jogador fica guardado no celular: se a página recarregar, a pessoa continua no jogo.
const CHAVE = 'ifhoot.id';
const memoria = {
  ler() { try { return localStorage.getItem(CHAVE) || ''; } catch { return ''; } },
  gravar(valor) { try { if (valor) localStorage.setItem(CHAVE, valor); else localStorage.removeItem(CHAVE); } catch { /* modo anônimo: tudo bem */ } },
};

let d = null, telaAtual = '', prazo = 0, duracao = 1, enviando = false;

/* ===== Socket.IO: este celular é um OBSERVER da partida =====
   "auth" leva o id salvo: se o celular desconectar e voltar, o servidor sabe quem é. */
const socket = io({ auth: { tipo: 'jogador', id: memoria.ler() } });
socket.on('connect', () => $('reconectando').classList.remove('visivel'));
socket.on('disconnect', () => $('reconectando').classList.add('visivel'));
socket.on('connect_error', () => $('reconectando').classList.add('visivel'));
socket.on('tela', (dados) => {
  d = dados;
  desenhar();
});

function desenhar() {
  if (socket.auth.id && !d.eu) { // o servidor reiniciou ou o apresentador me removeu
    socket.auth.id = '';
    memoria.gravar('');
  }
  const eu = d.eu;
  let tela;
  if (!eu) tela = d.estado === 'ENCERRADA' ? 'fechada' : 'entrar';
  else if (d.estado === 'AGUARDANDO') tela = 'espera';
  else if (d.estado === 'PERGUNTA') tela = eu.respondeu ? 'enviada' : 'pergunta';
  else if (d.estado === 'RESULTADO') tela = 'resultado';
  else tela = 'final';

  // Só remonta a tela quando ela muda: assim o texto que a pessoa está digitando não some.
  const chave = tela + ':' + d.rodada;
  if (chave !== telaAtual) {
    telaAtual = chave;
    pintarFundo(null); // só a tela de resultado pinta o fundo de verde ou vermelho
    telas[tela]();
  }
  atualizar(tela);
}

const telas = {
  entrar() {
    $('tela').innerHTML = `
      <div class="centro">
        <p class="grande">Bora jogar?</p>
        <p class="sub">Escolha um apelido. Ele vai aparecer no telão.</p>
        <form id="form-entrar" autocomplete="off">
          <input class="campo" id="apelido" maxlength="16" placeholder="Seu apelido" required autocapitalize="words" enterkeyhint="go">
          <button class="botao largo" id="btn-entrar">Entrar</button>
        </form>
      </div>`;
    $('form-entrar').onsubmit = (e) => {
      e.preventDefault();
      const nome = $('apelido').value.trim();
      if (!nome) return;
      $('btn-entrar').disabled = true;
      socket.timeout(5000).emit('entrar', nome, (semResposta, r) => {
        if (semResposta || !r.ok) {
          const botao = $('btn-entrar');
          if (botao) botao.disabled = false;
          avisar(semResposta ? 'Sem conexão com o servidor. Confira o Wi-Fi.' : r.erro);
          return;
        }
        socket.auth.id = r.id; // para uma reconexão futura já levar o id
        memoria.gravar(r.id);
      });
    };
  },

  fechada() {
    $('tela').innerHTML = `
      <div class="centro">
        <div class="selo neutro">🏁</div>
        <p class="grande">Partida encerrada</p>
        <p class="sub">Aguarde o apresentador começar uma nova.</p>
      </div>`;
  },

  espera() {
    $('tela').innerHTML = `
      <div class="centro">
        <div class="selo ok">✓</div>
        <p class="grande">Você está dentro, <span id="meu-nome"></span>!</p>
        <p class="sub">Olhe para o telão: o jogo já vai começar.</p>
        <p class="info" id="info-espera"></p>
      </div>`;
    $('meu-nome').textContent = d.eu.nome;
  },

  pergunta() {
    const p = d.pergunta;
    const resposta = `<div class="botoes-opcoes ${p.opcoes.length === 2 ? 'duas' : ''}" id="opcoes">
           ${p.opcoes.map((o, i) => `<button class="btn-opcao op-${i}" data-i="${i}"><span class="letra">${LETRAS[i]}</span><span>${esc(o)}</span></button>`).join('')}
         </div>`;
    $('tela').innerHTML = `<div class="tempo"><div id="barra"></div></div><p class="enunciado">${esc(p.enunciado)}</p>${resposta}`;
    prazo = performance.now() + p.restanteMs;
    duracao = p.tempoTotalMs || 1;
    enviando = false;
    $('opcoes').onclick = (e) => {
      const botao = e.target.closest('.btn-opcao');
      if (botao) responder(botao.dataset.i, botao);
    };
  },

  enviada() {
    const p = d.pergunta;
    const v = d.eu.minhaResposta;
    const escolha = `<strong>${LETRAS[+v]}</strong> · ${esc(p.opcoes[+v])}`;
    $('tela').innerHTML = `
      <div class="tempo"><div id="barra"></div></div>
      <div class="centro">
        <div class="selo neutro">⏳</div>
        <p class="grande">Resposta enviada!</p>
        <p class="sub">Você marcou ${escolha}</p>
        <p class="info" id="info-respostas"></p>
      </div>`;
    prazo = performance.now() + p.restanteMs;
    duracao = p.tempoTotalMs || 1;
  },

  resultado() {
    const eu = d.eu;
    const r = d.resultado;
    if (!eu.participou) { // entrou depois que a pergunta fechou
      $('tela').innerHTML = `
        <div class="centro">
          <div class="selo neutro">👋</div>
          <p class="grande">Chegou na hora!</p>
          <p class="sub">A próxima pergunta já vale pontos para você.</p>
          <p class="info" id="info-posicao"></p>
        </div>`;
      return;
    }
    let selo, titulo, detalhe;
    if (eu.acertou) {
      selo = '<div class="selo ok">✓</div>';
      titulo = 'Acertou!';
      detalhe = `<p class="pontos-ganhos">+${fmt(eu.ultimosPontos)}</p>`;
      vibrar(80);
      pintarFundo('certo');
    } else {
      selo = eu.respondeu ? '<div class="selo erro">✕</div>' : '<div class="selo neutro">⏰</div>';
      titulo = eu.respondeu ? 'Errou' : 'Tempo esgotado';
      detalhe = `<p class="sub">Resposta certa: <strong>${esc(r.respostaCorreta)}</strong></p>`;
      vibrar([60, 50, 60]);
      pintarFundo(eu.respondeu ? 'errado' : 'neutro');
    }
    $('tela').innerHTML = `<div class="centro">${selo}<p class="grande">${titulo}</p>${detalhe}<p class="info" id="info-posicao"></p></div>`;
  },

  final() {
    const eu = d.eu;
    const medalha = { 1: '🥇', 2: '🥈', 3: '🥉' }[eu.posicao] || '🏁';
    const podio = (d.podio || []).map((j) => `
      <li class="${j.nome === eu.nome ? 'eu' : ''}"><span>${j.posicao}º</span><span>${esc(j.nome)}</span><span>${fmt(j.pontos)}</span></li>`).join('');
    $('tela').innerHTML = `
      <div class="centro">
        <div class="selo ${eu.posicao <= 3 ? 'ok' : 'neutro'}">${medalha}</div>
        <p class="grande">${eu.posicao}º lugar</p>
        <p class="sub">${fmt(eu.pontos)} pontos · obrigado por jogar!</p>
        <ol class="lista-podio">${podio}</ol>
      </div>`;
  },
};

/* Partes que mudam sem trocar de tela (contadores, pontos). */
function atualizar(tela) {
  const eu = d.eu;
  $('meus-pontos').hidden = !eu;
  if (eu) $('meus-pontos').textContent = `${fmt(eu.pontos)} pts`;
  if (tela === 'espera') {
    $('info-espera').innerHTML = `<strong>${d.totalJogadores}</strong> ${d.totalJogadores === 1 ? 'jogador na sala' : 'jogadores na sala'}`;
  } else if (tela === 'enviada') {
    $('info-respostas').innerHTML = `<strong>${d.respondidas}</strong> de ${d.totalJogadores} já responderam`;
  } else if (tela === 'resultado') {
    $('info-posicao').innerHTML = `Você está em <strong>${eu.posicao}º lugar</strong>`;
  }
}

function relogio() {
  const barra = $('barra');
  if (barra && d && d.estado === 'PERGUNTA') {
    barra.style.transform = `scaleX(${Math.max(0, prazo - performance.now()) / duracao})`;
  }
  requestAnimationFrame(relogio);
}
requestAnimationFrame(relogio);

function responder(valor, botao) {
  if (enviando) return;
  enviando = true;
  botao.classList.add('escolhida');
  $('opcoes').classList.add('enviando');
  socket.timeout(5000).emit('responder', valor, (semResposta, r) => {
    if (semResposta || !r.ok) {
      enviando = false;
      botao.classList.remove('escolhida');
      $('opcoes')?.classList.remove('enviando');
      avisar(semResposta ? 'Sem conexão com o servidor. Confira o Wi-Fi.' : r.erro);
    }
    // Se deu certo, o servidor manda a tela "Resposta enviada" pelo evento "tela".
  });
}

/* Pinta a tela toda (e a barra do navegador do celular) com a cor do resultado. null volta ao normal. */
const CORES_DO_NAVEGADOR = { certo: '#1e7a31', errado: '#c8191e', neutro: '#34495e' };
function pintarFundo(tipo) {
  if (tipo) document.body.dataset.feedback = tipo;
  else delete document.body.dataset.feedback;
  $('cor-do-navegador').content = CORES_DO_NAVEGADOR[tipo] || '#2f9e41';
}

function vibrar(padrao) {
  try { navigator.vibrate?.(padrao); } catch { /* sem vibração */ }
}

let avisoTimer = null;
function avisar(mensagem) {
  const el = $('aviso');
  el.textContent = mensagem;
  el.classList.add('visivel');
  clearTimeout(avisoTimer);
  avisoTimer = setTimeout(() => el.classList.remove('visivel'), 3500);
}
</script>
</body>
</html>
