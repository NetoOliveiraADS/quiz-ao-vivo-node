<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IFhoot! · Telão</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%232F9E41'/%3E%3Ccircle cx='14' cy='14' r='9' fill='%23C8191E' stroke='white' stroke-width='3'/%3E%3Ctext x='35' y='50' font-family='Arial' font-weight='900' font-size='42' text-anchor='middle' fill='white'%3E%3F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/comum.css">
<!-- Biblioteca do Socket.IO no navegador: o próprio servidor entrega este arquivo (sem internet). -->
<script src="/socket.io/socket.io.js"></script>
<link rel="stylesheet" href="/css/telao.css">
</head>
<body class="telao">

<header class="topo barra-marca">
  <div class="marca"><span class="logo" aria-hidden="true">?</span> IFhoot!</div>
  <div class="info-topo" id="info-topo"></div>
  <span class="conexao-caiu" id="conexao" hidden>Reconectando…</span>
  <button class="botao-sec" id="btn-padroes" aria-controls="painel-padroes" aria-expanded="false" aria-keyshortcuts="B" title="Atalho: B">Padrões em ação</button>
</header>

<main class="palco">
  <!-- 1. Sala de espera (estado AguardandoJogadores) -->
  <section class="tela" id="tela-AGUARDANDO">
    <div class="convite" id="convite">
      <div class="passo-entrada" id="passo-wifi" hidden>
        <div class="qr"><img id="qr-wifi" alt="QR code para entrar no Wi-Fi"></div>
        <div class="passo-texto">
          <p class="rotulo">1. Entre no Wi-Fi</p>
          <p class="url" id="wifi-nome"></p>
          <p class="dica" id="wifi-senha"></p>
        </div>
      </div>
      <div class="passo-entrada">
        <div class="qr" id="convite-qr"><img id="qr-jogo" alt="QR code para abrir o quiz"></div>
        <div class="passo-texto">
          <p class="rotulo" id="rotulo-jogo">Entre pelo celular</p>
          <p class="url" id="url-entrada">…</p>
          <p class="dica" id="dica-entrada"></p>
        </div>
      </div>
    </div>
    <div class="espera-baixo">
      <div class="painel">
        <h2>Jogadores <span class="contador" id="qtd-jogadores">0</span></h2>
        <p class="vazio" id="sem-jogadores">Esperando a turma entrar…</p>
        <div class="chips" id="chips" title="Clique em um nome para remover"></div>
      </div>
      <div class="painel">
        <h2>Pontuação</h2>
        <div class="estrategias" id="estrategias"></div>
        <p class="descricao-estrategia" id="descricao-estrategia"></p>
        <div class="acoes-espera">
          <button class="botao controle" id="btn-comecar" title="Atalho: Espaço">Começar ▶</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 2. Pergunta aberta (estado PerguntaAberta) -->
  <section class="tela" id="tela-PERGUNTA">
    <div class="cabeca">
      <span class="tipo" id="p-tipo"></span>
      <div class="relogio" id="relogio"><span id="p-tempo"></span></div>
    </div>
    <h1 class="enunciado" id="p-enunciado"></h1>
    <div class="opcoes" id="p-opcoes"></div>
    <div class="barra-tempo"><div id="p-barra"></div></div>
    <section class="placar-ao-vivo" aria-labelledby="titulo-ao-vivo">
      <h2 id="titulo-ao-vivo">Placar ao vivo</h2>
      <ol id="p-placar"></ol>
    </section>
    <div class="rodape">
      <span id="p-respondidas"></span>
      <button class="botao controle" id="btn-encerrar" title="Atalho: Espaço">Encerrar pergunta ▶</button>
    </div>
  </section>

  <!-- 3. Resultado da pergunta (estado MostrandoResultado) -->
  <section class="tela" id="tela-RESULTADO">
    <div class="resultado-grid">
      <div>
        <span class="tipo" id="r-tipo"></span>
        <h2 class="enunciado-menor" id="r-enunciado"></h2>
        <div id="r-respostas"></div>
      </div>
      <div>
        <h2 class="titulo-placar">Placar</h2>
        <ol class="placar" id="r-placar"></ol>
      </div>
    </div>
    <div class="rodape">
      <span id="r-acertos"></span>
      <button class="botao controle" id="btn-proxima" title="Atalho: Espaço">Próxima pergunta ▶</button>
    </div>
  </section>

  <!-- 4. Fim de jogo (estado PartidaEncerrada) -->
  <section class="tela" id="tela-ENCERRADA">
    <h1 class="titulo-final">🏆 Resultado final</h1>
    <div class="podio" id="podio"></div>
    <ul class="resto" id="resto"></ul>
    <div class="rodape">
      <span></span>
      <button class="botao controle" id="btn-nova" title="Atalho: Espaço">Nova partida ↺</button>
    </div>
  </section>
</main>

<aside class="painel-padroes" id="painel-padroes" aria-labelledby="titulo-padroes" hidden>
  <h2 id="titulo-padroes">Padrões em ação</h2>
  <dl>
    <div><dt>Singleton</dt><dd id="padroes-sala"></dd></div>
    <div><dt>State</dt><dd id="padroes-estado"></dd></div>
    <div><dt>Strategy</dt><dd id="padroes-estrategia"></dd></div>
    <div><dt>Observer</dt><dd id="padroes-observadores"></dd><dd class="ultimo-aviso" id="padroes-aviso" aria-live="polite"></dd></div>
  </dl>
</aside>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script type="module" src="/js/telao.js"></script>
</body>
</html>
